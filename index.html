<!DOCTYPE html>
<html lang="bn" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ভোটার সার্চ</title>
<style>
/* =========================================================
   TOKENS — new design (same as the search page)
   ========================================================= */
:root{
  --paper:#f7f5f0; --paper-2:#fcfbf7; --card:#ffffff;
  --ink:#131c18; --ink-2:#46544e; --ink-3:#7e8a84;
  --green:#0d4a37; --green-2:#177a5c; --green-wash:#e9f2ed;
  --accent:#b8402a; --accent-wash:#fbf0ed; --accent-line:#eec9c0;
  --amber:#9a6a10; --amber-wash:#fdf6e9; --amber-line:#ecdcc0;
  --blue:#2f4a8a; --blue-wash:#eef1fa; --blue-line:#d3dbee;
  --line:#e6e1d6; --line-2:#d3ccbe;
  --shadow-sm:0 1px 2px rgba(19,28,24,.04), 0 6px 16px -8px rgba(19,28,24,.12);
  --shadow:0 1px 2px rgba(19,28,24,.04), 0 16px 40px -18px rgba(19,28,24,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI","Noto Sans Bengali","Hind Siliguri",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:12px;
}
[data-theme="dark"]{
  --paper:#0d1411; --paper-2:#111a15; --card:#16211b;
  --ink:#e9f0eb; --ink-2:#a8b9b1; --ink-3:#71827a;
  --green:#177a5c; --green-2:#20a077; --green-wash:#132a22;
  --accent:#d9604a; --accent-wash:#2a1712; --accent-line:#4a2a22;
  --amber:#d0a34a; --amber-wash:#2a2213; --amber-line:#4a3d22;
  --blue:#7d97e0; --blue-wash:#141c2e; --blue-line:#2a3550;
  --line:#22302a; --line-2:#2f4038;
  --shadow-sm:0 1px 2px rgba(0,0,0,.3), 0 6px 16px -8px rgba(0,0,0,.5);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 16px 40px -18px rgba(0,0,0,.6);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:var(--sans);background:var(--paper);color:var(--ink);
  line-height:1.55;-webkit-font-smoothing:antialiased;
  transition:background .25s,color .25s;
}
::selection{background:var(--green);color:#fff}
button{font:inherit}
input{font:inherit}
.wrap{max-width:640px;margin:0 auto;padding:14px 14px 20px}

/* ---------- brand header ---------- */
.head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.brand-mark{
  width:40px;height:40px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:var(--green);color:#fff;font-family:var(--serif);font-size:20px;font-weight:700;
}
.brand-name{font-family:var(--serif);font-size:1.25rem;letter-spacing:-.01em;line-height:1.1;display:block}
.brand-sub{display:block;font-size:.6rem;letter-spacing:.17em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.head .spacer{flex:1}
.icon-btn{
  width:38px;height:38px;border-radius:9px;border:1px solid var(--line-2);background:var(--card);
  color:var(--ink-2);cursor:pointer;display:grid;place-items:center;transition:.16s;flex:none;
}
.icon-btn:hover{border-color:var(--green);color:var(--green);background:var(--green-wash)}
.icon-btn svg{width:17px;height:17px}
.sub{color:var(--ink-3);font-size:13px;margin:0 0 12px}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1.5px solid transparent;border-radius:9px;cursor:pointer;
  font-weight:600;font-size:.87rem;padding:10px 16px;min-height:40px;width:100%;
  transition:background .16s,border-color .16s,color .16s,transform .16s,box-shadow .16s;
  text-decoration:none;white-space:nowrap;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--green);color:#fff;box-shadow:0 8px 20px -10px rgba(13,74,55,.6)}
.btn-primary:hover{background:var(--green-2)}
.btn-ghost{background:var(--card);border-color:var(--line-2);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--green);color:var(--green);background:var(--green-wash)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);padding:14px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font-size:.78rem;font-weight:600;color:var(--ink-2);letter-spacing:.01em}
.input{
  width:100%;padding:11px 13px;min-height:44px;font-size:.92rem;
  border:1.5px solid var(--line-2);border-radius:9px;background:var(--card);color:var(--ink);
  transition:border-color .16s,box-shadow .16s,background .16s;
}
.input:focus{outline:none;border-color:var(--green-2);box-shadow:0 0 0 3px rgba(23,121,92,.14)}
.input::placeholder{color:var(--ink-3);opacity:.75}
.note{
  display:flex;gap:10px;font-size:.8rem;line-height:1.5;border-radius:9px;padding:11px 14px;margin:10px 0 0;
  background:var(--blue-wash);border:1px solid var(--blue-line);color:var(--blue);
}
.status{
  font-size:.84rem;font-weight:600;padding:11px 14px;border-radius:9px;margin:8px 0;
  background:var(--paper-2);border:1px solid var(--line);color:var(--ink-2);
}
.status.ok{background:var(--green-wash);border-color:var(--green-wash);color:var(--green)}
.status.bad{background:var(--accent-wash);border:1px solid var(--accent-line);color:var(--accent)}
iframe{width:100%;height:78vh;border:1px solid var(--line);border-radius:12px;background:var(--card)}
a.open{display:block;text-align:center;margin-top:10px;font-size:15px;color:var(--green);font-weight:600;text-decoration:none}
a.open:hover{text-decoration:underline}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="brand-mark" aria-hidden="true">ভ</div>
    <div>
      <span class="brand-name">ভোটার সার্চ</span>
      <span class="brand-sub">প্রাইভেট সার্চ</span>
    </div>
    <span class="spacer"></span>
    <button class="icon-btn" id="themeToggle" title="থিম বদলান" aria-label="থিম বদলান">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
  <p class="sub">প্রাইভেট সার্চ পেজ — শুধু আপনার নিজের ব্যবহারের জন্য</p>

  <div class="card" id="keyCard" style="display:none">
    <div class="field">
      <label for="key">সার্চ key লিখুন (একবারই দিতে হবে, এই ফোনেই থাকবে)</label>
      <input class="input" id="key" type="password" placeholder="key" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="saveKey" style="margin-top:12px">সংরক্ষণ করুন</button>
    <p class="note">key কোথাও পাঠানো হয় না, সাইটে বা GitHub-এ লেখা নেই — শুধু এই ফোনের ব্রাউজারে থাকে।</p>
  </div>

  <div class="status" id="status">লিংক চেক হচ্ছে…</div>
  <div id="viewer" style="display:none">
    <iframe id="frame" title="ভোটার সার্চ"></iframe>
    <a class="open" id="openLink" href="#" target="_blank" rel="noopener">নতুন ট্যাবে খুলুন ↗</a>
  </div>
  <div class="card" style="display:none" id="changeKeyCard">
    <button class="btn btn-ghost" id="changeKey">key বদলান / মুছুন</button>
  </div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var statusEl = $("status");

  // Theme (light/dark) — presentation only, same as the new design.
  try {
    var saved = localStorage.getItem("vs_theme");
    if (saved) document.documentElement.dataset.theme = saved;
  } catch (e) {}
  $("themeToggle").onclick = function () {
    var cur = document.documentElement.dataset.theme;
    var next = cur === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("vs_theme", next); } catch (e) {}
  };

  // Key in the page URL (?key=...) is saved once, then removed from the URL.
  var params = new URLSearchParams(location.search);
  var urlKey = params.get("key");
  if (urlKey) {
    try { localStorage.setItem("voter_key", urlKey); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  }

  var key = null;
  try { key = localStorage.getItem("voter_key") || ""; } catch (e) {}
  if (!key) { $("keyCard").style.display = "block"; }

  $("saveKey").onclick = function () {
    var v = $("key").value.trim();
    if (!v) { statusEl.textContent = "key লিখুন।"; statusEl.className = "status bad"; return; }
    try { localStorage.setItem("voter_key", v); } catch (e) {}
    key = v;
    $("keyCard").style.display = "none";
    load();
  };
  $("changeKey").onclick = function () {
    try { localStorage.removeItem("voter_key"); } catch (e) {}
    key = "";
    $("viewer").style.display = "none";
    $("changeKeyCard").style.display = "none";
    $("keyCard").style.display = "block";
    statusEl.textContent = "key মুছে ফেলা হয়েছে। নতুন key দিন।";
  };

  function load() {
    if (!key) return;
    statusEl.textContent = "লিংক চেক হচ্ছে…";
    statusEl.className = "status";
    fetch("current.json?ts=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error("http " + r.status); return r.json(); })
      .then(function (j) {
        if (!j.url) throw new Error("no url");
        var src = j.url + "/?key=" + encodeURIComponent(key);
        $("frame").src = src;
        $("openLink").href = src;
        $("viewer").style.display = "block";
        $("changeKeyCard").style.display = "block";
        statusEl.textContent = "লিংক চালু আছে — সার্চ খুলছে।";
        statusEl.className = "status ok";
      })
      .catch(function () {
        statusEl.textContent = "লিংক পাওয়া যাচ্ছে না — কিছুক্ষণ পর আবার চেষ্টা করুন।";
        statusEl.className = "status bad";
      });
  }
  load();
})();
</script>
</body>
</html>
